<title>HypoExplorer typography reference</title>
<style>
@font-face{font-family:Manrope;src:url('./Manrope-Variable.ttf') format('truetype');font-weight:200 800;font-display:swap}

img{display:block;max-width:100%;width:650px}

<h1>HypoExplorer typography reference</h1>
<h2>Reusable wordmark artwork</h2>
<img src="../exports/hypoexplorer-wordmark.png" alt="HypoExplorer wordmark artwork">
<h2>Companion font: Manrope ExtraBold 800</h2>

<p>Tracking: −0.035em. This licensed font is a companion for future typesetting; the approved generated artwork does not have an identifiable source font.</p>
