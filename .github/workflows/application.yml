name: Application

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true

env:
  # The dataset bundles are not in this repository; the app reads them, and
  # the query catalog it is built against, from the published data origin.
  VITE_BUNDLE_BASE_URL: https://data.hypoexplorer.com
  NODE_OPTIONS: --max-old-space-size=6144

# Each job is a separate required check on main. Keep the job names stable:
# renaming one silently drops it from the branch ruleset.
jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint --reporter=summary
      # check:upstream replays raw GEO inputs, so it runs in the maintainer's checkout.
      - run: pnpm run typecheck
      # Unused files, dependencies and exports in src/ (knip.json). knip loads
      # vite.config.ts to find the test setup and entries, and the config reads
      # the gitignored query catalog, so fetch it first.
      - run: pnpm run fetch:query
      - run: pnpm run deadcode
      - name: Test the agent-context tooling
        run: pnpm run test:context
      # The scripts/lib tests that need no retained evidence. The others read
      # inputs this repository does not carry; the maintainer runs them.
      - name: Test the build-script libraries
        run: pnpm run test:scripts
      # The service's side of the golden wire contract in
      # services/hypomap/codetection_wire.json; Unit tests cover the client's.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the HypoMap co-detection service
        run: |
          python -m pip install --quiet 'numpy>=2,<3'
          pnpm run test:service
      # The atlas exporter (scripts/hypomap) on a synthetic H5AD: exported counts,
      # the comparison index the service reads, and the release archive.
      - name: Test the HypoMap atlas exporter
        run: |
          python -m pip install --quiet 'h5py>=3.10,<4' 'pandas>=2,<4' 'scipy>=1.11,<2'
          pnpm run test:hypomap-build
      # Generated maps, links and review fingerprints must match the committed
      # sources (docs/agent-context/README.md). Reads files only; writes nothing.
      - name: Check the agent context
        run: pnpm run context:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fetch:query
      # The GTEx, HPA and Allen atlases (~230 MB) back the Expression survey and its tests.
      # The atlases are about 8,200 files. Cache them under the identity of what
      # the app host publishes (each atlas's manifest and validation record), so
      # they are downloaded again only after an atlas is republished.
      - name: Identify the published reference atlases
        id: atlases
        run: |
          key="$(pnpm --silent run fetch:expression --identity)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: atlas-cache
        with:
          path: |
            public/expression/gtex
            public/expression/hpa
            public/expression/allen-human
          key: expression-atlases-${{ steps.atlases.outputs.key }}
      - if: steps.atlas-cache.outputs.cache-hit != 'true'
        run: pnpm run fetch:expression
      # The HYPOMAP Visium atlas is built from its tracked source
      # (data/expression/visium/), not fetched; the build replays every value.
      - name: Build the HYPOMAP Visium atlas
        run: pnpm run build:expression-visium
      - name: Run tests
        # Tests that read retained evidence or pre-publication history are left
        # out of this repository's vite.config.ts; the maintainer runs them.
        # One worker per runner core.
        run: pnpm test --maxWorkers=100%

  build:
    name: Build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The atlases are about 8,200 files. Cache them under the identity of what
      # the app host publishes (each atlas's manifest and validation record), so
      # they are downloaded again only after an atlas is republished.
      - name: Identify the published reference atlases
        id: atlases
        run: |
          key="$(pnpm --silent run fetch:expression --identity)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            public/expression/gtex
            public/expression/hpa
            public/expression/allen-human
          key: expression-atlases-${{ steps.atlases.outputs.key }}
      # The same preparation as deploy:cf: the query catalog from R2, the tracker
      # catalog and the GTEx, HPA and Allen atlases (~230 MB) from the app host,
      # and the HYPOMAP Visium atlas built from its tracked source. It keeps an
      # atlas the cache restored complete and fetches or builds any other.
      - run: pnpm run prepare:deploy
      - name: Build production application
        run: pnpm run build
      # Release metadata, the bootstrap script, the static guide pages, the
      # citation version and the shipped atlases and tracker catalog must agree
      # with the committed source.
      - run: pnpm run verify:release
      - name: Install Chromium for built-site smoke checks
        run: pnpm exec playwright install --with-deps chromium --only-shell
      # The built site, served locally, loads its catalog and a study bundle from R2.
      - run: pnpm run test:smoke
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-smoke-report
          path: .tmp/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
